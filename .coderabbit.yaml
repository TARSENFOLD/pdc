# CodeRabbit Global Configuration — PDC v2
# https://docs.coderabbit.ai/configuration/overview

# Review settings
reviews:
  # Personality of the reviewer
  profile: "professional"
  # Detailed reviews are mandatory for PDC v2 (End-to-End integrity)
  request_review_command: 'coderabbit review'
  # Enable summary and walkthrough for every PR
  enable_summary: true
  enable_walkthrough: true

# Advanced technical settings
language_priorities:
  typescript: high
  javascript: medium
  css: medium
  markdown: high

# Files and directories to ignore
ignore_patterns:
  - "node_modules/**"
  - "dist/**"
  - ".gemini/**"
  - "tmp/**"
  - "coverage/**"
  - "*.lock"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"
  - "infra/strapi/.cache/**"
  - "infra/strapi/build/**"
  - "apps/web/dist/**"
  - "apps/edge/dist/**"
  - ".windsurf/**"
  - "docs/_archive/**"

# Knowledge base
knowledge_base:
  # Enable CodeRabbit to index project documentation
  enabled: true
  # Priority paths for documentation
  paths:
    - "docs/**"
    - ".planning/**"
    - ".planning/CONSTITUTION.md"
    - ".planning/REQUIREMENTS.md"
    - "specs/IMPORTANTE/**"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "GEMINI.md"

# Tools and linting
# We rely on existing monorepo linting (ESLint). No Prettier in this project.
tools:
  shellcheck:
    enabled: true

# PR Settings
pull_requests:
  # Require all code review comments to be resolved
  label_on_review: true
