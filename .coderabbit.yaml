# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Global Configuration - PDC v2

reviews:
  profile: 'assertive'
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  path_filters:
    - '!node_modules/**'
    - '!dist/**'
    - '!.gemini/**'
    - '!tmp/**'
    - '!coverage/**'
    - '!*.lock'
    - '!package-lock.json'
    - '!pnpm-lock.yaml'
    - '!yarn.lock'
    - '!infra/strapi/.cache/**'
    - '!infra/strapi/build/**'
    - '!infra/strapi/types/generated/**'
    - '!apps/web/dist/**'
    - '!apps/edge/dist/**'
    - '!apps/web/src/locales/**'
    - '!.windsurf/**'
    - '!docs/_archive/**'
    - '!public/**'
  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        Apply the repository AGENTS.md and canonical specs. Flag blind casts,
        unvalidated external data, RBAC drift, hidden failures, and telemetry regressions.
    - path: '**/*.spec.{ts,tsx}'
      instructions: |
        Require behavior-specific assertions and coverage for changed error paths.
        Reject shell-only, tautological, or always-present fallback assertions.
    - path: 'tests/e2e/**'
      instructions: |
        Require route-specific happy-path or explicit empty-state assertions.
        Generic main or first-heading assertions are insufficient.
    - path: '{Dockerfile,docker-compose*.yml,.github/workflows/**}'
      instructions: |
        Verify that secrets are scoped to trusted revisions and never embedded in artifacts.
        Require consistent RELEASE_SHA metadata across checkout, build, runtime, Sentry,
        deployment, and rollback paths. Flag fallbacks that hide missing production metadata.
  tools:
    shellcheck:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'specs/IMPORTANTE/**'
      - '.planning/CONSTITUTION.md'
      - '.planning/REQUIREMENTS.md'
      - 'apps/web/DESIGN.md'
      - 'docs/decisoes/adr-025-neuralconstellation-dual.md'
      - 'docs/decisoes/adr-026-glow-policy-card-border-token.md'
