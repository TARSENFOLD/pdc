    <script>
      (function() {
        const theme = localStorage.getItem('pdc-theme') || 'dark';
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        } else if (theme === 'system') {
          if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.classList.add('light');
          }
        }
      })();
    </script>
