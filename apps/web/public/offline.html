<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Sem ligação — PDC</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #dbe4e6;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #ccfbf1;
        color: #115e59;
        font-weight: 800;
      }
      h1 { margin: 24px 0 12px; font-size: 1.75rem; line-height: 1.15; }
      p { margin: 0; color: #475569; line-height: 1.6; }
      button {
        width: 100%;
        margin-top: 28px;
        padding: 13px 18px;
        border: 0;
        border-radius: 12px;
        background: #0f766e;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #5eead4; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">PDC</div>
      <h1>Estás sem ligação à internet</h1>
      <p>As áreas pessoais e as simulações precisam de ligação para proteger os teus dados. Verifica a rede e tenta novamente.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
