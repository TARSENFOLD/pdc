<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>PDC — Sem ligação</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171310; color: #f7f2ed; }
      main { width: min(32rem, calc(100% - 3rem)); text-align: center; }
      h1 { font-size: clamp(1.8rem, 6vw, 3rem); margin-bottom: 1rem; }
      p { color: #cfc5bc; line-height: 1.6; }
      button { margin-top: 1.5rem; border: 0; border-radius: 999px; padding: .8rem 1.2rem; font: inherit; font-weight: 700; background: #d17a3e; color: #171310; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Estás sem ligação</h1>
      <p>O PDC não guarda dados privados nem confirma progresso offline. Liga-te à internet para continuar com segurança.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
