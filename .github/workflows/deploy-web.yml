name: Deploy Web (Cloudflare Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - develop
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'

env:
  NODE_VERSION: "24"
  PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_EDGE_URL: ${{ vars.VITE_EDGE_URL }}
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build web app
        run: npm run build -w apps/web

      - name: Skip Cloudflare Pages deploy when project is not configured
        if: vars.CF_PAGES_PROJECT_NAME == ''
        run: echo "::notice title=Cloudflare Pages deploy skipped::Set repository variable CF_PAGES_PROJECT_NAME to enable Pages deploy."

      - name: Deploy preview to Cloudflare Pages
        if: vars.CF_PAGES_PROJECT_NAME != '' && github.ref == 'refs/heads/develop'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: '.'
          command: pages deploy apps/web/dist --project-name=${{ env.PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Deploy production to Cloudflare Pages
        if: vars.CF_PAGES_PROJECT_NAME != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/principal')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: '.'
          command: pages deploy apps/web/dist --project-name=${{ env.PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
