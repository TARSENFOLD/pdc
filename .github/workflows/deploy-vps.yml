name: Deploy VPS (Hetzner)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
  VPS_DEPLOY_DIR: /opt/pdc
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy automatico aceita apenas CI de push no main deste repositorio.
    # Manual dispatch continua disponivel para recuperacao operacional.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          missing=()
          for variable in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("${variable}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "RELEASE_SHA must be the full 40-character Git commit SHA." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify approved revision
        shell: bash
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${RELEASE_SHA}" ]]; then
            echo "Checked-out revision does not match the CI-approved RELEASE_SHA." >&2
            exit 1
          fi

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf '%s\n' "${VPS_HOST_KEY}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOL
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            IdentityFile ~/.ssh/vps_key
            StrictHostKeyChecking yes
          EOL
          chmod 600 ~/.ssh/config

      - name: Sync repo to VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='apps/web/node_modules' \
            --exclude='apps/api/node_modules' \
            --exclude='infra/strapi/node_modules' \
            --exclude='packages/shared/node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.rollback' \
            --exclude='.secrets-history' \
            ./ vps:${{ env.VPS_DEPLOY_DIR }}

      - name: Deploy services on VPS
        run: |
          ssh vps bash -s -- "${VPS_DEPLOY_DIR}" "${RELEASE_SHA}" <<'REMOTE'
          set -eu
          cd "$1"
          RELEASE_SHA="$2" bash scripts/deploy-vps.sh
          REMOTE

      - name: Health check API
        run: |
          wait_for() {
            local url="$1" tries="${2:-24}"
            for _attempt in $(seq 1 "$tries"); do
              curl -sf --max-time 10 "$url" >/dev/null && return 0
              sleep 5
            done
            echo "Health check failed: $url" >&2
            return 1
          }
          wait_for "https://api.usepdc.com/health"

      - name: Health check Strapi
        run: |
          wait_for() {
            local url="$1" tries="${2:-24}"
            for _attempt in $(seq 1 "$tries"); do
              curl -sf --max-time 10 "$url" >/dev/null && return 0
              sleep 5
            done
            echo "Health check failed: $url" >&2
            return 1
          }
          wait_for "https://cms.usepdc.com/_health"

      - name: Collect redacted VPS diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          ssh vps bash -s -- "${VPS_DEPLOY_DIR}" "${RELEASE_SHA}" <<'REMOTE'
          set -eu
          cd "$1"
          RELEASE_SHA="$2" bash scripts/deploy-vps.sh diagnostics
          REMOTE
