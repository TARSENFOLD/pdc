name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "24"

jobs:
  # ─── Frontend — apps/web ────────────────────────────────────────────────────
  web:
    name: "web — lint + typecheck + build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint (apps/web)
        run: npm run lint -w apps/web

      - name: Type check (apps/web)
        run: npm run typecheck -w apps/web

      - name: Build (apps/web)
        run: npm run build -w apps/web

  # ─── Lighthouse CI — NF7 (performance ≥75 · a11y ≥85) ──────────────────────
  lighthouse:
    name: "lighthouse — mobile perf + a11y"
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build web app
        run: npm run build -w apps/web

      - name: Install Lighthouse CI + serve
        run: npm install -g @lhci/cli@0.14.x serve

      - name: Run Lighthouse CI
        run: lhci autorun
        continue-on-error: true  # warning level until NF7 threshold is met

      - name: Upload LHCI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report
          path: .lighthouseci/
          retention-days: 14

  # ─── BFF — apps/api ─────────────────────────────────────────────────────────
  api:
    name: "api — lint + typecheck + build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint (apps/api)
        run: npm run lint -w apps/api

      - name: Type check (apps/api)
        run: npm run typecheck -w apps/api

      - name: Build (apps/api)
        run: npm run build -w apps/api

  # ─── Shared package ──────────────────────────────────────────────────────────
  shared:
    name: "shared — lint + typecheck + build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (packages/shared)
        run: npm run lint -w packages/shared

      - name: Type check (packages/shared)
        run: npm run typecheck -w packages/shared

      - name: Build (packages/shared)
        run: npm run build -w packages/shared

  # ─── Docs Validator — "Doc is Law" gate ────────────────────────────────────
  docs:
    name: "docs — link check + code references"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate internal links and code references
        run: npm run validate:docs

      - name: Lint Markdown
        run: npm run lint:docs
        continue-on-error: true

  # ─── E2E Smoke — Playwright (PRs + push) ────────────────────────────────────
  e2e-smoke:
    name: "e2e — Playwright smoke (Chromium)"
    runs-on: ubuntu-latest
    needs: [web, api, shared]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build API
        run: npm run build -w apps/api

      - name: Build Web
        run: npm run build -w apps/web

      - name: Start test infrastructure (Strapi + PG + Redis)
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 120

      - name: Seed test accounts
        run: npx tsx tests/helpers/seed.ts
        env:
          DEV_SKIP_OTP: "true"
          API_URL: http://localhost:3001
          STRAPI_URL: http://localhost:1337
          STRAPI_API_TOKEN: test-strapi-token
          REDIS_URL: redis://localhost:6379

      - name: Run Playwright smoke tests
        run: npx playwright test --project=smoke
        env:
          DEV_SKIP_OTP: "true"
          NODE_ENV: test
          API_URL: http://localhost:3001
          FRONTEND_URL: http://localhost:5173
          STRAPI_URL: http://localhost:1337
          STRAPI_API_TOKEN: test-strapi-token
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          REDIS_URL: redis://localhost:6379

      - name: Run A11y Audit (Axe-Core)
        continue-on-error: true # Warning level for W0; will be hardened in W3
        run: npm run test:e2e:a11y --if-present
        env:
          DEV_SKIP_OTP: "true"
          NODE_ENV: test
          STRAPI_URL: http://localhost:1337
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:5173

      - name: Stop test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  # ─── E2E Full — Playwright (main only) ──────────────────────────────────────
  e2e-full:
    name: "e2e — Playwright full (Chromium + Firefox)"
    runs-on: ubuntu-latest
    needs: [web, api, shared]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Build API
        run: npm run build -w apps/api

      - name: Build Web
        run: npm run build -w apps/web

      - name: Start test infrastructure (Strapi + PG + Redis)
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 120

      - name: Seed test accounts
        run: npx tsx tests/helpers/seed.ts
        env:
          DEV_SKIP_OTP: "true"
          API_URL: http://localhost:3001
          STRAPI_URL: http://localhost:1337
          REDIS_URL: redis://localhost:6379

      - name: Run Playwright full suite
        run: npx playwright test --project=chromium --project=firefox
        env:
          DEV_SKIP_OTP: "true"
          NODE_ENV: test
          STRAPI_URL: http://localhost:1337
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:5173

      - name: Stop test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 14
