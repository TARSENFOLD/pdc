name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "24"

jobs:
  # ─── Frontend — apps/web ────────────────────────────────────────────────────
  web:
    name: "web — lint + typecheck + build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint (apps/web)
        run: npm run lint -w apps/web

      - name: Type check (apps/web)
        run: npm run typecheck -w apps/web

      - name: Build (apps/web)
        run: npm run build -w apps/web

  # ─── BFF — apps/api ─────────────────────────────────────────────────────────
  api:
    name: "api — lint + typecheck + build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint (apps/api)
        run: npm run lint -w apps/api

      - name: Type check (apps/api)
        run: npm run typecheck -w apps/api

      - name: Build (apps/api)
        run: npm run build -w apps/api

  # ─── Shared package ──────────────────────────────────────────────────────────
  shared:
    name: "shared — lint + typecheck + build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (packages/shared)
        run: npm run lint -w packages/shared

      - name: Type check (packages/shared)
        run: npm run typecheck -w packages/shared

      - name: Build (packages/shared)
        run: npm run build -w packages/shared
