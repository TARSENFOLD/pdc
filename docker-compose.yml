services:
  # ─── Strapi v5 ─────────────────────────────────────────────────────────────
  strapi:
    build: ./infra/strapi
    container_name: pdc-strapi
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: pdc_strapi
      DATABASE_USERNAME: pdc
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pdc_dev_password}
      NODE_ENV: development
      APP_KEYS: ${STRAPI_APP_KEYS:-toBeModified1,toBeModified2}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-toBeModified}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-toBeModified}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-toBeModified}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-toBeModified}
    volumes:
      - ./infra/strapi:/opt/app:Z
      - pdc-strapi-modules:/opt/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1337/_health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pdc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdc_strapi
      POSTGRES_USER: pdc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdc_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pdc-postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdc -d pdc_strapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (compatível com Upstash para dev local) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pdc-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - pdc-redis-data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pdc-postgres-data:
    driver: local
  pdc-redis-data:
    driver: local
  pdc-strapi-modules:
    driver: local
